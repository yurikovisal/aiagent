[project]
name = "meza-ai-backend"
version = "0.1.0"
description = "MEZA AI Platform — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "sqlalchemy[asyncio]==2.0.40",
  "asyncpg==0.30.0",
  "alembic==1.15.2",
  "redis==5.2.1",
  "arq==0.26.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "cryptography==44.0.2",
  "minio==7.2.15",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
