# Опционально: docker compose -f docker-compose.yml -f docker-compose.langfuse.yml --profile langfuse up -d
services:
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    networks:
      - meza

  langfuse-web:
    image: langfuse/langfuse:2
    profiles: ["langfuse"]
    depends_on:
      - langfuse-db
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-nextauth-change-me}
      SALT: ${LANGFUSE_SALT:-langfuse-salt-change-me}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3100:3000"
    networks:
      - meza

volumes:
  langfuse_db:
