name: meza-ai

services:
  traefik:
    image: traefik:v3.3
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - meza

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meza_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-meza_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meza} -d ${POSTGRES_DB:-meza_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - meza

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - meza

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meza}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-meza_minio_change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meza

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-meza} $${MINIO_ROOT_PASSWORD:-meza_minio_change_me};
      mc mb -p local/meza-media || true;
      mc mb -p local/meza-docs || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meza}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-meza_minio_change_me}
    networks:
      - meza

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-meza}:${POSTGRES_PASSWORD:-meza_dev_change_me}@postgres:5432/${POSTGRES_DB:-meza_ai}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meza}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meza_minio_change_me}
      MINIO_BUCKET_MEDIA: meza-media
      MINIO_BUCKET_DOCS: meza-docs
      MINIO_SECURE: "false"
      API_SECRET_KEY: ${API_SECRET_KEY:-change-me-to-a-long-random-string}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b-instruct-q4_K_M}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.meza-api.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`)
      - traefik.http.routers.meza-api.entrypoints=web
      - traefik.http.services.meza-api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - meza

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  meza:
    driver: bridge
